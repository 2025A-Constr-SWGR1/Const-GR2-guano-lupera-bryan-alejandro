# Maven package Java project Web App to Linux on Azure
trigger:
- main

variables:
  azureSubscription: '7cf906ca-8828-47b6-85ac-eb8540db4658'
  webAppName: 'U-Food'
  environmentName: 'U-Food'
  vmImageName: 'ubuntu-latest'
  dockerRepository: 'bryang02/u-food'
  dockerRegistryServiceConnection: 'dockerhub'

stages:
- stage: CI
  displayName: Continuous Integration
  jobs:
  - job: Build_and_Test
    displayName: Build and Run Unit Tests
    pool:
      vmImage: $(vmImageName)

    steps:
      # Construcción y pruebas de JUnit5
    - task: Maven@4
      displayName: 'Build and Run Tests with Maven'
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        jdkArchitectureOption: 'x64'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        testRunTitle: 'JUnit5 Tests'

      # Cálculo de la cobertura de código con JaCoCo
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage Results'
      inputs:
        codeCoverageTool: 'JaCoCo'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
        pathToSources: '$(System.DefaultWorkingDirectory)'
        reportDirectory: '$(System.DefaultWorkingDirectory)/target/site/jacoco'

      # Análisis de vulnerabilidades de dependencias
    - task: Maven@4
      displayName: 'Security Scan with OWASP Dependency Check'
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        goals: 'org.owasp:dependency-check-maven:check'

      # SonarQube para análisis de calidad de código
    - task: SonarQubePrepare@5
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'SonarQube'
        scannerMode: 'Other'
    - task: SonarQubeAnalyze@5
      displayName: 'Run SonarQube Analysis'
    - task: SonarQubePublish@5
      displayName: 'Publish SonarQube Results'

      # Construcción de imagen Docker
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        repository: $(dockerRepository)
        dockerfile: 'Dockerfile'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest

      # Carga del artefacto war para el despliegue de la aplicación
    - task: CopyFiles@2
      displayName: 'Copy Artifacts to Staging Directory'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: '**/target/*.?(war|jar)'
        TargetFolder: $(Build.ArtifactStagingDirectory)

      # Publica el war generado
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifacts'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifact: 'drop'
        publishLocation: 'pipeline'

- stage: CD
  displayName: Continuous Deployment
  dependsOn: CI
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy to Azure Web App
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: 'webApp'
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/**/*.war'
